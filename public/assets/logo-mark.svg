<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divyasnan app icon mark">
  <defs>
    <linearGradient id="m_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4A23C"/>
      <stop offset="100%" stop-color="#D2611C"/>
    </linearGradient>
    <linearGradient id="m_drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6FD0E3"/>
      <stop offset="100%" stop-color="#0E6E86"/>
    </linearGradient>
    <linearGradient id="m_lotus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="100%" stop-color="#FFC23C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="300" height="300" rx="64" fill="url(#m_bg)"/>
  <!-- droplet -->
  <path d="M150,40 C150,40 96,120 96,170 a54,54 0 1 0 108,0 C204,120 150,40 150,40 Z"
        fill="url(#m_drop)" stroke="#FFF6E6" stroke-width="6"/>
  <!-- lotus inside droplet -->
  <g transform="translate(150,178)">
    <path d="M0,0 C-9,-34 -26,-40 -26,-40 C-29,-19 -17,-5 0,0 Z" fill="url(#m_lotus)"/>
    <path d="M0,0 C9,-34 26,-40 26,-40 C29,-19 17,-5 0,0 Z" fill="url(#m_lotus)"/>
    <path d="M0,0 C-19,-30 -44,-26 -44,-26 C-41,-7 -22,2 0,0 Z" fill="#FFD56A"/>
    <path d="M0,0 C19,-30 44,-26 44,-26 C41,-7 22,2 0,0 Z" fill="#FFD56A"/>
    <path d="M0,2 C-10,-42 0,-50 0,-50 C10,-42 0,2 0,2 Z" fill="#FFF6E6"/>
  </g>
</svg>
